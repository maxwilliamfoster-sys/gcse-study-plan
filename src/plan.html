<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a school planner. A sticky tab bar, then one view at a time; the Today view is a timeline of 45-minute periods matching the online-school bells. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e8ecf2; --fg:#18202b; --muted:#5a6575; --line:#d5dbe4;
  --accent:#2f5bd3; --accent-ink:#ffffff; --good:#1f8a4c; --warn:#b26a00;
  --m:#2f5bd3; --s:#1f8a4c; --h:#9a4a1c; --g:#c2337a; --lit:#7a3fc4; --lang:#b8860b; --gen:#5a6575;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#181e28; --sunk:#202836; --fg:#e7ebf2; --muted:#9aa5b6; --line:#2c3545;
  --accent:#7d9cff; --accent-ink:#0d1220; --good:#4cc47e; --warn:#f0a83a;
  --m:#7d9cff; --s:#4cc47e; --h:#e08a58; --g:#ff79b4; --lit:#b48cff; --lang:#e7bb45; --gen:#9aa5b6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#181e28; --sunk:#202836; --fg:#e7ebf2; --muted:#9aa5b6; --line:#2c3545;
  --accent:#7d9cff; --accent-ink:#0d1220; --good:#4cc47e; --warn:#f0a83a;
  --m:#7d9cff; --s:#4cc47e; --h:#e08a58; --g:#ff79b4; --lit:#b48cff; --lang:#e7bb45; --gen:#9aa5b6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800;margin-block:28px 10px}
h3{font-size:18px;font-weight:600}
a{color:var(--accent)}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
header.top{display:grid;gap:14px;margin-bottom:14px}
.countdown{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline}
.countdown .big{font-family:var(--display);font-size:clamp(34px,7vw,56px);font-weight:800;color:var(--accent);line-height:1}
.boards{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--surface);flex-wrap:wrap;max-width:100%}
header.top>*{min-width:0}
.countdown>*{min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--gen));flex:none}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{font:600 15px var(--body);border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
nav.tabs button:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar label{display:inline-flex;gap:8px;align-items:center;font-size:15px}
input[type="date"],select{font:15px var(--body);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.btn{font:600 14px var(--body);padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.phase{padding:14px 16px;border-radius:12px;background:var(--sunk);display:grid;gap:4px}
.phase b{font-family:var(--display);font-size:18px}
/* timeline */
.timeline{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}
.slot .time{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:12px;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--gen));border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.card.quiet{background:transparent;border-style:dashed;border-left-width:1px;padding:8px 14px}
.card.live{border-left-style:double;border-left-width:8px}
.card .head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.card .subj{font-family:var(--display);font-weight:800;font-size:17px;color:var(--c,var(--fg))}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);font-weight:700}
.tag.live{background:var(--c);color:var(--bg)}
.focus{font-weight:700}
ol.how{margin:0;padding-left:20px;display:grid;gap:3px}
ol.how li::marker{font-family:var(--mono);color:var(--muted);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.vids{display:grid;gap:4px;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.vids b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vids a{display:inline-flex;gap:6px;align-items:baseline;text-decoration:none}
.vids a:hover span.t{text-decoration:underline}
.vids .play{color:var(--c,var(--accent));font-size:12px}
.vids .meta{color:var(--muted);font-size:12.5px}
.weekrow .vids{border-top:0;padding-top:4px;font-size:13px}
.done{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin-left:auto;cursor:pointer}
.done input{width:18px;height:18px;accent-color:var(--good)}
.slot.isdone .card{opacity:.55}
/* week grid */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.t{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.cell{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--c,var(--fg));white-space:nowrap}
.cell.live::after{content:"LIVE";font-size:10px;letter-spacing:.08em;padding:1px 5px;border-radius:4px;background:var(--c);color:var(--bg)}
.cell.skip{color:var(--muted);font-weight:400;text-decoration:line-through}
.weekgrid{min-width:760px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.alloc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.alloc div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:10px 12px}
.alloc b{font-family:var(--display);font-size:24px;color:var(--c)}
/* plan */
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details>summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-weight:600;font-size:17px;list-style:none;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";font-family:var(--mono);color:var(--muted);width:14px}
details[open]>summary::before{content:"−"}
details .inner{padding:0 14px 14px;display:grid;gap:10px;min-width:0}
.weekrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:8px}
.weekrow div{border-left:4px solid var(--c);padding:4px 10px;font-size:14px;min-width:0}
.weekrow div b{display:block;color:var(--c);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
/* subjects */
.subjnav{display:flex;flex-wrap:wrap;gap:6px}
.subjnav button{font:600 14px var(--body);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.subjnav button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.box ul{margin:0;padding-left:20px;display:grid;gap:4px}
.checklist{list-style:none;padding:0!important}
.checklist li{display:flex;gap:8px;align-items:flex-start}
.checklist input{margin-top:4px;width:17px;height:17px;accent-color:var(--good);flex:none}
.prog{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);width:0}
.note{border-left:4px solid var(--warn);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px}
/* exams */
.exam{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px}
.exam.past{opacity:.5}
.exam .d{font-family:var(--mono);font-size:13px}
.exam .left{font-family:var(--display);font-weight:800;color:var(--c);text-align:right;white-space:nowrap}
@media (max-width:560px){
  .slot{grid-template-columns:1fr;gap:4px}
  .slot .time{text-align:left;padding-top:0}
  .exam{grid-template-columns:1fr auto}
  .exam .d{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .2s}}
</style>

<div class="wrap">

<script>
(function(){
"use strict";
/* ---------- storage (convenience only) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('gsp:'+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('gsp:'+k, JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- subjects ---------- */
const SUBJ = {
  M:   {name:'Maths', board:'Edexcel 1MA1 Higher', c:'var(--m)'},
  S:   {name:'Combined Science', board:'AQA 8464 Trilogy Higher', c:'var(--s)'},

  LIT: {name:'English Literature', board:'AQA 8702', c:'var(--lit)'},
  LANG:{name:'English Language', board:'AQA 8700', c:'var(--lang)'},
  GEN: {name:'Mixed', board:'', c:'var(--gen)'}
};

/* ---------- verified links ---------- */
const L = {

  aqalang:['AQA 8700 past papers + mark schemes','https://www.aqa.org.uk/subjects/english/gcse/english-8700/assessment-resources'],
  aqalit:['AQA 8702 past papers + mark schemes','https://www.aqa.org.uk/subjects/english/gcse/english-8702/assessment-resources'],
  gjh:['Jekyll and Hyde full text (free)','https://www.gutenberg.org/ebooks/43'],
  grj:['Romeo and Juliet full text (free)','https://www.gutenberg.org/ebooks/1513'],
  pme:['PMT AQA English resources','https://www.physicsandmathstutor.com/english-revision/gcse-aqa/'],
  ocr:['OCR J410 page','https://www.ocr.org.uk/qualifications/gcse/history-a-explaining-the-modern-world-j410-from-2016/'],
  ocrpp:['OCR past paper finder (pick J410)','https://www.ocr.org.uk/qualifications/past-paper-finder/'],
  ocrspec:['J410 specification (PDF)','https://www.ocr.org.uk/Images/207163-specification-accredited-gcse-history-a-first-teaching-2019-with-first-assessment-2021-j410.pdf'],
  bbh:['Bitesize History: OCR A','https://www.bbc.co.uk/bitesize/examspecs/z2d4rdm'],
  bbusa:['Bitesize: The USA 1919–1948','https://www.bbc.co.uk/bitesize/topics/z3bwqfr'],
  bbcwv:['Bitesize: The Cold War and Vietnam','https://www.bbc.co.uk/bitesize/topics/z8ntxsg'],
  bbcw:['Bitesize: The Cold War','https://www.bbc.co.uk/bitesize/topics/zrgb7v4'],
  bbmig:['Bitesize: Britain and migration','https://www.bbc.co.uk/bitesize/topics/zcrg239'],
  allsop:['Mr Allsop History (YouTube)','https://www.youtube.com/@mrallsophistory'],

  bbg:['Bitesize German: AQA (grammar)','https://www.bbc.co.uk/bitesize/examspecs/z6t9fdm'],
  easy:['Easy German (listening, subtitles)','https://www.youtube.com/@EasyGerman'],
  app:['Your GCSE Plan app (flashcards)','https://maxwilliamfoster-sys.github.io/gcse-plan/'],
  anki:['Anki: GCSE 2027 deck (AnkiWeb for phone sync)','https://ankiweb.net/']
};
const VIDEOS = /*VIDEOS*/{};
function vidsFor(s, ph){ if (!(ph.p===1||ph.p===2||ph.p===3)) return []; return VIDEOS[ph.p+'-'+(ph.wk+1)+'-'+s] || []; }
function vidList(list, heading){ if (!list || !list.length) return ''; return `<div class="vids">${heading?`<b>${heading}</b>`:''}${list.map(v=>`<a href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener"><span class="play">▶</span><span><span class="t">${esc(v.title)}</span> <span class="meta">${esc(v.channel)}${v.length?' · '+esc(v.length):''}</span></span></a>`).join('')}</div>`; }
const links = keys => keys.map(k => `<a href="${L[k][1]}" target="_blank" rel="noopener">${esc(L[k][0])}</a>`).join('');

/* ---------- dates ---------- */
const D = (y,m,d) => new Date(y,m-1,d);
const P1 = D(2026,10,12), XMAS = D(2026,12,21), P2 = D(2027,1,4), P3 = D(2027,3,29), P4 = D(2027,5,10), END = D(2027,6,19);
const DAY = 864e5;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysBetween = (a,b) => Math.round((startOfDay(b) - startOfDay(a)) / DAY);
const wkBetween = (a,b) => Math.floor(daysBetween(a,b) / 7);
const fmt = (d, o) => d.toLocaleDateString('en-GB', o || {weekday:'short', day:'numeric', month:'short'});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* ---------- exams (AQA provisional May/June 2027 timetable, OCR final June 2027 timetable, JCQ common slots for maths) ---------- */
const EXAMS = [
  ['2027-05-10','pm','G','German Paper 1 Listening (Higher, 45 min, includes dictation)'],
  ['2027-05-10','pm','G','German Paper 3 Reading (Higher, 1 h, includes translation into English)'],
  ['2027-05-11','am','S','Biology Paper 1 (1 h 15) · topics B1–B4'],
  ['2027-05-12','am','LIT','Literature Paper 1 (1 h 45) · Romeo and Juliet + Jekyll and Hyde'],
  ['2027-05-14','am','M','Maths Paper 1 non-calculator (1 h 30)'],
  ['2027-05-17','am','S','Chemistry Paper 1 (1 h 15) · topics C1–C5'],
  ['2027-05-18','pm','G','German Paper 4 Writing (Higher, 1 h 15)'],
  ['2027-05-19','am','LIT','Literature Paper 2 (2 h 15) · An Inspector Calls, Power and Conflict, unseen poetry'],
  ['2027-05-20','am','H','History Paper 1 (1 h 45) · International Relations 1918–75 + USA 1919–48'],
  ['2027-05-24','am','LANG','Language Paper 1 (1 h 45) · Explorations in creative reading and writing'],
  ['2027-05-25','am','S','Physics Paper 1 (1 h 15) · topics P1–P4'],
  ['2027-05-27','am','M','Maths Paper 2 calculator (1 h 30)'],
  ['2027-05-28','am','H','History Paper 2 (1 h) · Migration to Britain c.1000–c.2010'],
  ['2027-06-08','am','LANG','Language Paper 2 (1 h 45) · Writers’ viewpoints and perspectives'],
  ['2027-06-09','pm','H','History Paper 3 (1 h 15) · Impact of Empire 1688–c.1730 + Spitalfields'],
  ['2027-06-10','am','S','Biology Paper 2 (1 h 15) · topics B5–B7'],
  ['2027-06-14','am','M','Maths Paper 3 calculator (1 h 30)'],
  ['2027-06-15','am','S','Chemistry Paper 2 (1 h 15) · topics C6–C10'],
  ['2027-06-18','am','S','Physics Paper 2 (1 h 15) · topics P5–P7']
].map(e => ({date:new Date(e[0]+'T00:00'), sess:e[1], s:e[2], what:e[3]}));

/* ---------- weekly timetable ---------- */

/* ---------- utilities ---------- */
function phaseOf(d){
  d = startOfDay(d);
  if (d < XMAS) return {p:1, wk:Math.max(0, Math.min(9, wkBetween(P1,d))), name:'Phase 1 · Learn everything once', range:'12 Oct – 18 Dec'};
  if (d < P2) {
    const rest = d < D(2026,12,28);
    return {p:'x', wk:0, rest, name: rest ? 'Christmas · Rest week' : 'Christmas · Catch-up week', range: rest ? '21–27 Dec' : '28 Dec – 3 Jan'};
  }
  if (d < P3) return {p:2, wk:Math.min(11, wkBetween(P2,d)), name:'Phase 2 · Exam technique on every topic', range:'4 Jan – 26 Mar'};
  if (d < P4) return {p:3, wk:Math.min(5, wkBetween(P3,d)), name:'Phase 3 · Past papers + German speaking', range:'29 Mar – 9 May'};
  if (d < END) return {p:4, wk:0, name:'Exam season', range:'10 May – 18 Jun'};
  return {p:5, wk:0, name:'Done', range:''};
}
function focusFor(s, ph){
  const arr = PLAN[ph.p] && PLAN[ph.p][s];
  return arr ? arr[Math.min(ph.wk, arr.length-1)] : '';
}

/* ---------- header ---------- */
function header(){
  const today = startOfDay(new Date());
  const next = EXAMS.find(e => e.date >= today);
  if (next){
    const n = Math.round((next.date - today)/DAY);
    $('#daysLeft').textContent = n;
    $('#daysLeftTxt').innerHTML = `days until your next exam: <b>${esc(SUBJ[next.s].name)}</b> on ${fmt(next.date,{weekday:'long',day:'numeric',month:'long'})}`;
  } else { $('#daysLeft').textContent = '✓'; $('#daysLeftTxt').textContent = 'Exams finished.'; }
  $('#boards').innerHTML = ['M','S','LANG','LIT','H','G'].map(k => `<span class="chip" style="--c:${SUBJ[k].c}"><i class="dot"></i>${esc(SUBJ[k].name)} <span class="muted">${esc(SUBJ[k].board)}</span></span>`).join('');
}

function card(o){
  const c = SUBJ[o.s] ? SUBJ[o.s].c : 'var(--gen)';
  const id = o.id;
  const done = store.get('done:'+id, false);
  return `<div class="slot${done?' isdone':''}" data-id="${id}">
    <div class="time">${o.t1}<br>${o.t2}</div>
    <div class="card${o.quiet?' quiet':''}${o.live?' live':''}" style="--c:${c}">
      <div class="head">
        <span class="subj">${esc(o.title)}</span>
        ${o.tag?`<span class="tag${o.live?' live':''}">${esc(o.tag)}</span>`:''}
        ${o.quiet?'':`<label class="done"><input type="checkbox" id="chk-${id}" ${done?'checked':''}> done</label>`}
      </div>
      ${o.focus?`<p class="focus">${esc(o.focus)}</p>`:''}
      ${o.how&&o.how.length?`<ol class="how">${o.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ol>`:''}

}

            desc: k==='M' ? 'Your next Maths self-study block practises whatever this lesson covered. Swap it in for the plan topic if they differ.' : k==='S' ? 'If the lesson covered a different topic from the plan, use your next Science block for that lesson’s topic.' : 'English lessons cover Language and Literature. Note which text or question type they used.'}));
        }
      } else {
        out.push(studyBlock(code, ph, i, d, t));
      }
    });
    out.push(card({id:iso(d)+'-rev', t1:'16:00', t2:'16:20', s:'GEN', title:'End-of-day blurt and plan', tag:'20 min',
      how:['8 min: blank page. Write everything you remember from today.','7 min: check against your notes and fill the gaps in another colour.','5 min: write tomorrow’s 3 weak spots. Hit them first.']}));
    if (wd>=1 && wd<=4) out.push(card({id:iso(d)+'-eve', t1:'evening', t2:'optional', s:'G', title:'Anki, 15 min', quiet:true, desc:'Finish any cards still due (sync AnkiWeb to use your phone). Sleep locks it in.'}));
  }
  html += `<div class="timeline">${out.join('')}</div>`;
  $('#v-today').innerHTML = html;

  $('#dpick').onchange = e => { if (e.target.value){ const [y,m,dd] = e.target.value.split('-').map(Number); viewDate = D(y,m,dd); renderToday(); } };
  const shift = n => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate()+n); renderToday(); };
  $('#prevD').onclick = () => shift(-1);
  $('#nextD').onclick = () => shift(1);
  $('#todayD').onclick = () => { viewDate = startOfDay(new Date()); renderToday(); };
  const hb = $('#holiday'); if (hb) hb.onchange = e => { store.set(holKey, e.target.checked); renderToday(); };
  document.querySelectorAll('#v-today .done input').forEach(cb => cb.onchange = e => {
    const slot = e.target.closest('.slot'); store.set('done:'+slot.dataset.id, e.target.checked); slot.classList.toggle('isdone', e.target.checked);
  });
}
function examDay(d){
  const upcoming = EXAMS.filter(e => e.date >= d);
  const todays = EXAMS.filter(e => +e.date === +d);
  const nexts = upcoming.filter(e => +e.date !== +d).slice(0,2);
  let h = '';
  if (todays.length) h += todays.map((e,j) => card({id:iso(d)+'-ex'+j, t1:e.sess==='am'?'09:00':'13:30', t2:'exam', s:e.s, title:'EXAM: '+e.what, tag:e.sess.toUpperCase(),
      how: e.sess==='am' ? ['Breakfast, water and a light 20-minute flashcard warm-up. No new learning.','Black pens, calculator, ruler, clear pencil case. Arrive 30 minutes early.'] : ['Morning: a light 45 minutes of flashcards on this paper, then a walk.','Eat lunch before you go. Arrive 30 minutes early.']})).join('');
  const wd = d.getDay();
  if (nexts.length && wd !== 0){
    const a = nexts[0], b = nexts[1];
    h += card({id:iso(d)+'-x1', t1:'block 1–3', t2:'2 h 15', s:a.s, title:'Next up: '+a.what, tag:fmt(a.date),
      how:['45 min: retrieval. Flashcards and a blurt of the whole paper’s content.','45 min: timed section of a past paper for this exact paper.','45 min: mark it and fix the gaps.'], ln:(HOW[3][a.s]||{ln:[]}).ln});
    if (b) h += card({id:iso(d)+'-x2', t1:'block 4–5', t2:'1 h 30', s:b.s, title:'Then: '+b.what, tag:fmt(b.date),
      how:['45 min: flashcards and a blurt.','45 min: the questions you got wrong last time.'], ln:(HOW[3][b.s]||{ln:[]}).ln});
    h += card({id:iso(d)+'-x3', t1:'16:00', t2:'16:20', s:'GEN', title:'Pack your bag for the next exam + early night', quiet:true});
  } else if (wd === 0) {
    h += card({id:iso(d)+'-xs', t1:'Sunday', t2:'', s:'GEN', title:'Light day', quiet:true, desc:'An hour of flashcards for tomorrow’s exam at most. Rest is part of the plan.'});
  }
  return h || `<p class="note">No exams left.</p>`;
}

/* ---------- WEEK ---------- */
function renderWeek(){
  const rows = [];
  const label = (code, wd, i) => {
    if (code.startsWith('L:')){ const lv = LIVE[code.slice(2)]; return `<span class="cell live" style="--c:${SUBJ[lv.s].c}">${esc(lv.name.replace(' (online lesson)',''))}</span>`; }
    if (code === 'QUIZ') return `<span class="cell" style="--c:var(--gen)">Mixed quiz</span>`;
    return `<span class="cell" style="--c:${SUBJ[code].c}"><i class="dot"></i>${esc(SUBJ[code].name)}</span>`;
  };
  const days = [1,2,3,4,5];
  const line = (t1,t2,cells) => `<tr><td class="t">${t1}–${t2}</td>${cells}</tr>`;
  const sat = {
    '09:00':'<span class="cell" style="--c:var(--gen)">Timed practice paper</span>',
    '09:45':'<span class="cell" style="--c:var(--gen)">(continues to 10:30)</span>',
    '11:00':'<span class="cell" style="--c:var(--gen)">Mark + corrections (10:45–11:30)</span>'
  };
  rows.push(line('08:00','08:15', days.map(()=>`<td><span class="cell" style="--c:var(--g)"><i class="dot"></i>Flashcards</span></td>`).join('')+'<td></td>'));
  BLOCK_TIMES.forEach((t,i)=>{
    if (i===3) rows.push(line('10:30','11:00', `<td colspan="5" class="muted">Break</td><td class="muted">Break</td>`));
    if (i===5) rows.push(line('12:30','13:30', `<td colspan="5" class="muted">Lunch: get outside or train</td><td class="muted">Free</td>`));
    if (i===7) rows.push(line('15:00','15:15', `<td colspan="5" class="muted">Break</td><td></td>`));
    const cells = days.map(wd => {
      const skip = SKIPPED[wd] && SKIPPED[wd][i];
      return `<td>${label(WEEK[wd][i], wd, i)}${skip?`<div class="cell skip small">${esc(skip)}</div>`:''}</td>`;
    }).join('');
    rows.push(line(t[0], t[1], cells + `<td>${sat[t[0]]||''}</td>`));
  });
  rows.push(line('16:00','16:20', days.map(()=>`<td><span class="cell" style="--c:var(--gen)">Blurt + plan</span></td>`).join('')+'<td></td>'));

  // Allocation
  const count = {};
  Object.values(WEEK).flat().forEach(c => { if (!c.startsWith('L:')) count[c] = (count[c]||0)+1; });
  const lessons = {M:3, S:3, LANG:6};
  const alloc = ['H','G','S','M','LIT','LANG'].map(k => `<div style="--c:${SUBJ[k].c}"><b class="mono">${count[k]||0}</b> <span class="small">self-study blocks</span><br><span class="small">${esc(SUBJ[k].name)}${lessons[k]?` <span class="muted">+ ${lessons[k]} live lessons${k==='LANG'?' (English, shared with Lit)':''}</span>`:''}</span></div>`).join('');

  $('#v-week').innerHTML = `
    <p>This is a term-time week. Live lessons are fixed from your Autumn 1 online timetable and ELAC is left out. Every other 45-minute period is self-study on the same bell times, so your day feels like school.</p>
    <div class="scroll"><table class="weekgrid"><thead><tr><th>Time</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <h2>Why this split</h2>
    <div class="alloc">${alloc}</div>
    <ul class="small">
      <li><b>History and German get the most self-study</b> because you have no live lessons for them, and they are content-heavy (History) and skill-heavy (German: 4 papers, each 25%).</li>
      <li><b>Science gets 6</b>: it counts as two GCSEs across 6 papers, on top of 3 lessons a week.</li>
      <li><b>Maths gets 4</b> extra blocks. Most fall on lesson days, so you practise what was just taught while it’s fresh.</li>
      <li><b>English</b> already has 6 live sessions a week (Y11 English, Writing, Essentials), so Literature gets 3 blocks for quotes and essays, and Language gets 2.</li>
      <li>No subject runs twice in a row. Switching subjects (interleaving) feels harder but gives better long-term recall.</li>
      <li>Total: about 6½ hours a day including lessons, finishing at 16:20. That is sustainable for 30 weeks. Going much longer hits diminishing returns.</li>
    </ul>
    <p class="note">If your <b>Autumn 2</b> online timetable changes after half term, the lesson slots move. Send me the new PDF and I’ll re-fit it.</p>`;
}

function renderPlan(){

  const rows = EXAMS.map(e => {
    const n = Math.round((e.date - today)/DAY);
    return `<div class="exam${n<0?' past':''}" style="--c:${SUBJ[e.s].c}"><span class="d">${fmt(e.date,{weekday:'short',day:'numeric',month:'short'})} · ${e.sess.toUpperCase()}</span><span><b>${esc(SUBJ[e.s].name)}</b> · ${esc(e.what)}</span><span class="left">${n<0?'done':n===0?'today':n+' d'}</span></div>`;
  }).join('');
  $('#v-exams').innerHTML = `
    <div class="exam" style="--c:var(--g)"><span class="d">12 Apr – 21 May</span><span><b>German</b> · Speaking test window (your school picks the day, 10–12 min + 15 min preparation)</span><span class="left">NEA</span></div>
    ${rows}
    <div class="exam" style="--c:var(--gen)"><span class="d">Wed 23 Jun</span><span><b>Contingency day</b> · keep it free in case an exam is moved</span><span class="left"></span></div>
    <p class="small muted">Sources: AQA provisional May/June 2027 timetable (Science, English, German), OCR final June 2027 timetable (History), JCQ common timetable slots for Maths (14 May, 27 May, 14 June, confirmed on Pearson’s provisional timetable). AM starts at 9:00 and PM at 13:30. Your personal candidate timetable from your school is the final word, so check it when you get it.</p>
    <p class="note">The May half term (31 May – 4 June) falls in the exam gap. Use it for Language Paper 2, History Paper 3, Maths Paper 3 and the three Science Paper 2s.</p>`;
}

/* ---------- METHOD ---------- */
function renderMethod(){
  $('#v-method').innerHTML = `
  <p>You want to learn a lot fast. These are the techniques that research rates highest for that, and the plan is built from them. Rereading and highlighting feel productive but are the least effective, so the plan avoids them.</p>
  <div class="grid2">
    <div class="box"><h3>1. Test yourself (retrieval practice)</h3><p>Pulling information out of memory is what strengthens it. Every block ends with a question, a blurt or flashcards. If a block is only reading or watching, it didn’t count.</p></div>
    <div class="box"><h3>2. Space it out</h3><p>Revisit a topic after about 1 day, 3 days, 1 week and 3 weeks. Anki does the spacing for you. Your GCSE 2027 deck has about 4,100 cards in plan order, 35 new a day, finishing by early February. The Friday quiz pulls topics from 2–3 weeks back on purpose.</p></div>
    <div class="box"><h3>3. Mix subjects (interleaving)</h3><p>No subject runs twice in a row, and in Maths you mix question types. It feels harder, but that difficulty is what improves exam performance.</p></div>
    <div class="box"><h3>4. Past papers + mark schemes</h3><p>The fastest way to learn what examiners reward. Always mark with the official scheme, and copy its exact wording into your flashcards.</p></div>
    <div class="box"><h3>Blurting (how to)</h3><ol class="how"><li>Pick a topic. Blank page, 5–8 minutes, write everything you remember.</li><li>Open your notes and fill the gaps in a different colour.</li><li>The coloured bits are tomorrow’s flashcards.</li></ol></div>
    <div class="box"><h3>Mistake log (how to)</h3><ol class="how"><li>One page per subject: the question, why you lost marks, the correct answer.</li><li>Redo each one 3 days later, then a week later.</li><li>Two correct redos in a row: cross it off.</li></ol></div>
    <div class="box"><h3>Your Anki deck (how to)</h3><ol class="how"><li>Always click the top deck, <b>GCSE 2027</b>. New cards then arrive in this plan’s order, every subject mixed.</li><li>35 new cards a day, about 30–40 minutes with reviews: the 08:00 warm-up plus 15 minutes in the evening.</li><li>Be honest: press Again if you didn’t know it. Good is the normal button.</li><li>Never skip a day. Reviews pile up fast, and missing a day doubles the next one.</li></ol></div>
    <div class="box"><h3>Working from home</h3><ul><li>Same start time every day (08:00), dressed, at a desk, never in bed.</li><li>Phone in another room during blocks. Use it only for flashcards in the warm-up.</li><li>Lunch outside or at the gym. Exercise helps memory and focus.</li><li>Sleep 8–9 hours. Memory is consolidated during sleep, so an all-nighter costs marks.</li></ul></div>
    <div class="box"><h3>If you fall behind</h3><ul><li>Don’t try to catch up by doubling the next day. Skip the missed block and carry on with today.</li><li>Put the missed topic on Saturday or your weak list.</li><li>Priority if time is tight: German vocab every day, History content, Science Paper 1 topics, then the rest.</li></ul></div>
  </div>
  <p class="small muted">The ranking of techniques comes from Dunlosky et al. (2013), "Improving Students’ Learning With Effective Learning Techniques": practice testing and distributed practice were the only two rated high utility.</p>`;
}

/* ---------- tabs ---------- */
const R = {today:renderToday, week:renderWeek, plan:renderPlan, subjects:renderSubjects, exams:renderExams, method:renderMethod};
function show(v){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v===v));
  Object.keys(R).forEach(k => { $('#v-'+k).hidden = k!==v; });
  R[v](); store.set('tab', v);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
header();
const h = (location.hash||'').slice(1);
show(R[h] ? h : store.get('tab','today'));
})();
</script>
